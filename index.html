<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spud Shockers 3D</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #111;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }
        #container3d {
            width: 100%; height: 100%;
            display: block;
        }
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        /* Game UI / HUD Overlay */
        #hud {
            position: absolute;
            bottom: 30px; left: 30px;
            color: white; font-size: 28px; font-weight: bold;
            z-index: 5;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.5);
            padding: 15px 25px;
            border-radius: 8px;
            border: 2px solid #ffcc00;
        }
        #score-board {
            position: absolute;
            top: 30px; right: 30px;
            color: #ffcc00; font-size: 24px; font-weight: bold;
            z-index: 5;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }
        /* 2D Overlay Weapon (Retains smooth tracking independent of 3D load) */
        #weapon-sprite {
            position: absolute;
            bottom: 0; right: 25%;
            width: 320px; height: auto;
            z-index: 6;
            pointer-events: none;
            transform-origin: bottom right;
            transition: transform 0.05s ease;
        }
        /* Start / Main Menu Screen */
        #menu-container {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background: radial-gradient(circle, #3a2e1d 0%, #14100a 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            color: white; text-align: center;
        }
        .title {
            font-size: 56px; color: #ffcc00; margin-bottom: 5px;
            text-shadow: 4px 4px 0px #990000;
            font-weight: 900; letter-spacing: 2px;
        }
        .btn-play {
            background: #ff9900; color: white; border: 4px solid white;
            padding: 15px 50px; font-size: 28px; font-weight: bold;
            cursor: pointer; border-radius: 12px; margin-top: 25px;
            box-shadow: 0 8px 0px #b36b00;
            transition: transform 0.1s;
        }
        .btn-play:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #b36b00;
        }
        .controls-hint {
            margin-top: 30px; color: #ccc; font-size: 16px; line-height: 1.6;
        }
    </style>
    <!-- Load Three.js 3D rendering package via trusted public content network -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="hud">
        🥔 HP: <span id="hp-val">100</span> | 🎯 AMMO: <span id="ammo-val">30</span>
    </div>

    <div id="score-board">
        SPUD KILLS: <span id="kills-val">0</span>
    </div>

    <!-- Hand-drawn style retro submachine gun -->
    <img id="weapon-sprite" src="https://ibb.co" alt="Spatula Rifle">

    <div id="menu-container">
        <div class="title">SPUD SHOCKERS 3D</div>
        <p style="font-size: 20px; color: #ffcc00;">MASH THE ENEMY POTATOES OR GET MASHED!</p>
        <button class="btn-play" onclick="lockPointerAndStart()">SPAWN SPUD</button>
        <div class="controls-hint">
            <b>W, A, S, D</b> - Move Around<br>
            <b>MOUSE</b> - Look 360 Degrees Around<br>
            <b>LEFT CLICK</b> - Fire Weapon<br>
            <b>ESC</b> - Unlock Mouse / Pause Menu
        </div>
    </div>

    <div id="container3d"></div>

    <script>
        let scene, camera, renderer, clock;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let activeEnemies = [];
        let playerHp = 100, kills = 0, ammo = 30, isReloading = false;
        let isGameRunning = false;
        
        // Advanced 3D camera look variables 
        let yaw = 0, pitch = 0;
        const lookSensitivity = 0.0022;

        function initGameEngine() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff); // Bright cartoon sky
            scene.fog = new THREE.FogExp2(0xa0c4ff, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0); // Eye level position

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('container3d').appendChild(renderer.domElement);

            // Light mapping
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xfffaed, 0.8);
            sun.position.set(20, 40, 20);
            scene.add(sun);

            // Create Massive Shell Shockers Styled Grid Arena
            const mapSize = 120;
            const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const floorMat = new THREE.MeshToonMaterial({ color: 0x7a9a60 }); // Cartoon lawn grass green
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Add Arena Boundary Walls
            const wallMat = new THREE.MeshToonMaterial({ color: 0xb58a63 });
            const createBoundWall = (w, h, d, x, y, z) => {
                let box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                box.position.set(x, y, z);
                scene.add(box);
            };
            createBoundWall(mapSize, 8, 2, 0, 4, -mapSize/2);
            createBoundWall(mapSize, 8, 2, 0, 4, mapSize/2);
            createBoundWall(2, 8, mapSize, -mapSize/2, 4, 0);
            createBoundWall(2, 8, mapSize, mapSize/2, 4, 0);

            // Add Random Obstacles (Blocks and Pillars)
            for(let i=0; i < 18; i++) {
                let size = Math.random() * 4 + 3;
                let obsMesh = new THREE.Mesh(new THREE.BoxGeometry(size, size*2, size), new THREE.MeshToonMaterial({color: 0xdeb887}));
                obsMesh.position.set(Math.random() * 80 - 40, size, Math.random() * 80 - 40);
                scene.add(obsMesh);
            }

            // Bind Control Triggers
            window.addEventListener('keydown', (e) => toggleMovementKeys(e.code, true));
            window.addEventListener('keyup', (e) => toggleMovementKeys(e.code, false));
            window.addEventListener('mousemove', processMouseLook);
            window.addEventListener('mousedown', executeWeaponFire);
            window.addEventListener('resize', adaptWindowResize);

            // Monitor browser Pointer Lock states
            document.addEventListener('pointerlockchange', checkPointerLockStatus);
            
            // Spawn initial enemy wave
            for(let i=0; i<4; i++) spawnEnemyPotato();
        }

        function lockPointerAndStart() {
            document.body.requestPointerLock();
        }

        function checkPointerLockStatus() {
            if (document.pointerLockElement === document.body) {
                document.getElementById('menu-container').style.display = 'none';
                isGameRunning = true;
            } else {
                document.getElementById('menu-container').style.display = 'flex';
                isGameRunning = false;
            }
        }

        function toggleMovementKeys(code, isPressed) {
            if (code === 'KeyW' || code === 'ArrowUp') moveForward = isPressed;
            if (code === 'KeyS' || code === 'ArrowDown') moveBackward = isPressed;
            if (code === 'KeyA' || code === 'ArrowLeft') moveLeft = isPressed;
            if (code === 'KeyD' || code === 'ArrowRight') moveRight = isPressed;
        }

        function processMouseLook(e) {
            if (!isGameRunning) return;
            // Native PointerLock API gives raw movement deltas completely immune to edge lag
            yaw -= e.movementX * lookSensitivity;
            pitch -= e.movementY * lookSensitivity;
            pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch)); // Lock constraints

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        function spawnEnemyPotato() {
            // Build an Egg/Potato geometric primitive shape
            const bodyGroup = new THREE.Group();
            
            const spudMesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.5, 16, 16),
                new THREE.MeshToonMaterial({ color: 0xcd853f }) // Potato brown
            );
            spudMesh.scale.set(1, 1.4, 1); // Stretches sphere into a ShellShocker egg shape
            bodyGroup.add(spudMesh);

            // Add Cartoon Enemy Glasses/Eyes
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({color: 0xff0000}));
Use code with caution.
eye.position.set(0, 0.8, 1.2);
bodyGroup.add(eye);
// Random position away from center spawn area
bodyGroup.position.set(Math.random() * 80 - 40, 2.1, Math.random() * 80 - 40);
scene.add(bodyGroup);
activeEnemies.push({
mesh: bodyGroup,
hp: 40,
speed: 4 + Math.random() * 3,
shootTimer: Math.random() * 2
});
}
function executeWeaponFire(e) {
if (!isGameRunning || isReloading || ammo <= 0) return;
ammo--;
document.getElementById('ammo-val').innerText = ammo;
// Recoil kickback animation trigger for the 2D overlay sprite
const gun = document.getElementById('weapon-sprite');
gun.style.transform = 'scale(1.2) translateY(15px) rotate(-5deg)';
setTimeout(() => gun.style.transform = 'scale(1) translateY(0) rotate(0)', 60);
// System Raycast tracking intersection algorithms
let camDirection = new THREE.Vector3();
camera.getWorldDirection(camDirection);
activeEnemies.forEach((enemy, index) => {
let vectorToEnemy = enemy.mesh.position.clone().sub(camera.position);
let distance = vectorToEnemy.length();
// Calculate alignment hit accuracy vector check
let projectedTarget = camera.position.clone().add(camDirection.clone().multiplyScalar(distance));
let distanceError = projectedTarget.distanceTo(enemy.mesh.position);
if (distanceError < 2.2) { // Direct registration target confirmation match
enemy.hp -= 20;
// Flash enemy white to signal damage registration
enemy.mesh.children[0].material.color.setHex(0xffffff);
setTimeout(() => enemy.mesh.children[0].material.color.setHex(0xcd853f), 80);
if(enemy.hp <= 0) {
scene.remove(enemy.mesh);
activeEnemies.splice(index, 1);
kills++;
document.getElementById('kills-val').innerText = kills;
// Respawn new target onto map instantly to keep player engaged
setTimeout(spawnEnemyPotato, 1000);
}
}
});
// Automatically manage empty clip logic parameters
if (ammo === 0) {
isReloading = true;
document.getElementById('ammo-val').innerText = "RELOADING...";
setTimeout(() => {
ammo = 30;
document.getElementById('ammo-val').innerText = ammo;
isReloading = false;
}, 1500);
}
}
function loopPhysicsAndGraphics(delta) {
// Apply drag dampening parameters natively to vector speeds
velocity.x -= velocity.x * 8.0 * delta;
velocity.z -= velocity.z * 8.0 * delta;
direction.z = Number(moveForward) - Number(moveBackward);
direction.x = Number(moveRight) - Number(moveLeft);
direction.normalize();
const currentDirectionEuler = new THREE.Euler(0, yaw, 0, 'YXZ');
const transformedSpeedVector = new THREE.Vector3(direction.x, 0, direction.z).applyEuler(currentDirectionEuler);
if (moveForward || moveBackward) velocity.z -= transformedSpeedVector.z * 55.0 * delta;
if (moveLeft || moveRight) velocity.x -= transformedSpeedVector.x * 55.0 * delta;
camera.position.addScaledVector(velocity, delta);
// Hard boundary map containment constraint limits
camera.position.x = Math.max(-58, Math.min(58, camera.position.x));
camera.position.z = Math.max(-58, Math.min(58, camera.position.z));
// Enemy AI State Matrix Tracking
activeEnemies.forEach((enemy) => {
// Look direction mapping tracking player coordinates
enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);
// Move directly toward the player's 3D spatial quadrant location
let pathVector = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position).normalize();
enemy.mesh.position.addScaledVector(pathVector, enemy.speed * delta);
// Check automated combat damage range limits
let currentDistanceToPlayer = enemy.mesh.position.distanceTo(camera.position);
if (currentDistanceToPlayer < 3.5) {
playerHp = Math.max(0, playerHp - (25 * delta)); // Continuous close quarters drain
document.getElementById('hp-val').innerText = Math.floor(playerHp);
if (playerHp <= 0) {
alert(💥 SCRAMBLED! You were mashed by the potatoes.\nKills: ${kills});
location.reload();
}
}
});
}
function runGameLoop() {
requestAnimationFrame(runGameLoop);
const delta = Math.min(clock.getDelta(), 0.1); // Dynamic execution capping
if (isGameRunning) {
loopPhysicsAndGraphics(delta);
}
renderer.render(scene, camera);
}
function adaptWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
// Initialize Engine Startup
initGameEngine();
runGameLoop();
